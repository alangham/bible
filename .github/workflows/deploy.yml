# Builds the site and deploys dist to GitHub Pages.
# The build gets no secrets. The site does not use an ESV key (docs/DESIGN.md section 5).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # package-lock.json was written by npm 11.6.1. The npm 10 of Node 22
      # rejects it ("Missing: @emnapi/core@2.0.0-beta.2 from lock file").
      - run: npm install -g npm@11.6.1
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check that dist has no ESV address
        run: |
          if grep -rq "api.esv.org" dist; then
            echo "dist contains api.esv.org"
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
