<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bible wall prototype</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--ink:#1D1D1F;--mute:#6E6E73;--line:rgba(0,0,0,.09);--bg:#fff;--c:#1D1D1F}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-anchor:none}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
[hidden]{display:none!important}

#wall{margin:0 auto}
.n{display:block;overflow:hidden;font-weight:800;text-transform:uppercase;white-space:nowrap;line-height:1.03;-webkit-tap-highlight-color:transparent}
@media(hover:hover){.n{transition:opacity .15s}.n:hover{opacity:.62}}
.n:focus-visible,.back:focus-visible,.where:focus-visible,.lnk:focus-visible,#panel a:focus-visible,.prev:focus-visible{outline:2px solid currentColor;outline-offset:2px;border-radius:2px}
.band{color:#fff;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.2}
#meas{position:absolute;left:0;top:0;font-size:100px;pointer-events:none}

.bar{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);z-index:10;font-size:15px;font-weight:500;color:var(--mute)}
.back{padding:12px 10px;margin-left:-10px;min-width:84px}
.where{background:none;border:0;color:var(--mute);padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:500}
.where b{color:var(--ink);font-weight:600;margin-right:6px}
.where i{font-style:normal;font-size:11px;margin-left:5px;display:inline-block;transition:transform .2s}
.where[aria-expanded=true] i{transform:rotate(180deg)}
.sp{min-width:84px}
#panel{position:fixed;top:52px;left:0;right:0;max-height:calc(100vh - 52px);overflow:auto;background:#fff;border-bottom:1px solid var(--line);z-index:9;padding:18px 20px 24px;box-shadow:0 14px 30px rgba(0,0,0,.08)}
#panel .grid{max-width:700px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
#panel a{display:flex;align-items:center;justify-content:center;height:44px;border-radius:8px;font-weight:600;font-size:16px;color:var(--c)}
@media(hover:hover){#panel a:hover{background:rgba(0,0,0,.05)}}
#panel a.cur{background:var(--c);color:#fff}
#shade{position:fixed;inset:52px 0 0 0;background:rgba(0,0,0,.18);z-index:8}

#col{max-width:748px;margin:0 auto;padding:100px 24px 45vh;font-family:Lora,Georgia,"Times New Roman",serif;font-size:21px;line-height:1.65}
.prev{display:inline-block;font:500 15px Inter,system-ui,sans-serif;color:var(--mute);padding:8px 0;margin:0 0 26px}
section+section{margin-top:84px}
section.newbook{margin-top:132px}
.bk{display:inline-block;background:var(--c);font:700 12px/1.2 Inter,system-ui,sans-serif;padding:5px 8px;margin-bottom:8px}
.head{display:flex;align-items:flex-end;gap:.24em;margin:0 0 30px;font-family:Inter,system-ui,sans-serif;font-size:52px;line-height:.9;color:var(--c)}
.head.full{font-size:76px}
.head .name{font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.head .num{font-weight:300}
.about{font:400 15px/1.5 Inter,system-ui,sans-serif;margin:-12px 0 30px;padding:0 0 16px;border-bottom:1px solid var(--line)}
.lnk{background:none;border:0;padding:8px 0;font-weight:600;font-size:15px;color:var(--c);cursor:pointer}
.lnk i{font-style:normal;display:inline-block;margin-left:4px;transition:transform .2s}
.lnk[aria-expanded=true] i{transform:rotate(90deg)}
.about dl{display:grid;grid-template-columns:96px 1fr;gap:8px 16px;margin:8px 0 6px}
.about dt{color:var(--mute)}.about dd{margin:0}
.about .sd{margin:6px 0 4px;padding:12px 14px;background:#F5F5F7;border-radius:10px}
.about .sd h5{margin:0 0 2px;font-size:13px;font-weight:600;color:var(--mute)}
.about .sd p{margin:0 0 10px}.about .sd p:last-child{margin:0}
.draft{font:600 11px Inter,system-ui,sans-serif;letter-spacing:.06em;color:var(--mute);border:1px solid rgba(0,0,0,.15);border-radius:4px;padding:2px 6px;margin-left:10px;vertical-align:1px}
h3,h4{font-family:Inter,system-ui,sans-serif;color:var(--ink)}
h3{font-size:17px;line-height:1.3;font-weight:600;margin:34px 0 10px}
h4{font-size:15px;line-height:1.3;font-weight:600;color:var(--mute);margin:26px 0 8px}
.ms{font:700 13px Inter,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;text-align:center;color:var(--c);margin:10px 0 4px}
.hd{font:500 14px Inter,system-ui,sans-serif;text-align:center;color:var(--mute);margin:0 0 20px}
.qa{font-size:1.25em;text-align:center;color:var(--c);margin:28px 0 8px}
.head+h3,.about+h3,.meta+h3,.head+.ms,.meta+.ms{margin-top:0}
p{margin:0 0 .9em}
p.q1,p.q2,p.li1,p.li2,p.qr,p.qd{margin:0}
p.q1{padding-left:2.4em;text-indent:-1em}
p.q2{padding-left:3.8em;text-indent:-1em}
p.li1{padding-left:1.4em}p.li2{padding-left:2.8em}
p.qr{text-align:right}
p.d,p.qd{font-style:italic;color:#3a3a3c}
p.pc{text-align:center}
p.pe{margin-bottom:.9em}
.gap{height:.9em}
sup.v{font:600 .6em Inter,system-ui,sans-serif;color:var(--c);margin-right:.28em;vertical-align:.6em;line-height:0;text-indent:0}
.vn{white-space:nowrap}
sup.o{color:var(--mute)}
p.q1>.vn:first-child>sup.v,p.q2>.vn:first-child>sup.v,p.li1>.vn:first-child>sup.v,p.li2>.vn:first-child>sup.v{display:inline-block;box-sizing:border-box;width:2.3em;margin-left:-2.3em;margin-right:0;padding-right:.5em;text-align:right}
.x{font:400 13px/1.45 Inter,system-ui,sans-serif;color:var(--mute);margin:-4px 0 10px}
.note{font:400 13px/1.5 Inter,system-ui,sans-serif;color:var(--mute);border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:0 0 1.1em}
.end{font:500 14px Inter,system-ui,sans-serif;color:var(--mute);text-align:center;margin-top:90px}
section{position:relative}
.mk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;margin:0 0 0 -6px;padding:0;border:0;background:none;vertical-align:.12em;cursor:pointer;text-indent:0;-webkit-tap-highlight-color:transparent}
.mk::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--d);box-sizing:border-box}
.mk.e::before{background:none;border:1.75px solid var(--d)}
@media(hover:hover){.mk:hover::before{transform:scale(1.35)}}
.mk:focus-visible,.xl:focus-visible,.rwc:focus-visible,.ml:focus-visible,#trail button:focus-visible,.echo:focus-visible,#pop button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
body.noecho .mk.e,body.noecho .ml.e{display:none}
.xl{background:none;border:0;padding:4px 0;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.meta{margin:-12px 0 30px;padding:0 0 16px;border-bottom:1px solid var(--line)}
.meta.small{margin:-16px 0 22px;padding:0;border:0}
.meta .about{margin:0;padding:0;border:0}
.rw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-family:Inter,system-ui,sans-serif;margin-top:6px}
.meta.small .rw{margin-top:0}
.rwl{font-size:13px;font-weight:600;color:var(--mute);margin-right:2px}
.rwc{background:#F5F5F7;border:0;border-radius:999px;padding:7px 12px;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
@media(hover:hover){.rwc:hover{background:#EBEBEF}}
.rws{font-size:12px;color:var(--mute);margin-left:2px}
p.hit{background:rgba(0,0,0,.06);box-shadow:0 0 0 8px rgba(0,0,0,.06);border-radius:3px}
p{transition:background .9s,box-shadow .9s}
#col.mg .mk{display:none}
.mgc{position:absolute;left:calc(100% + 36px);top:0;width:260px}
.ml{position:absolute;left:0;display:flex;align-items:center;gap:7px;min-height:24px;background:none;border:0;padding:3px 0;font:600 13px Inter,system-ui,sans-serif;color:var(--d);cursor:pointer;white-space:nowrap}
.ml.e{font-weight:500}
.ml i{width:9px;height:9px;border-radius:50%;background:var(--d);box-sizing:border-box;flex:none}
.ml.e i{background:none;border:1.75px solid var(--d)}
.ml span{font:600 11px Inter,system-ui,sans-serif;color:var(--mute);min-width:14px;text-align:right}
.echo{min-width:84px;text-align:right;background:none;border:0;color:var(--mute);font-weight:500;padding:12px 0;cursor:pointer;white-space:nowrap}
.echo .ph{display:none}
#trail{position:fixed;top:52px;left:0;right:0;height:40px;display:flex;align-items:center;gap:6px;padding:0 20px;background:#F5F5F7;border-bottom:1px solid var(--line);z-index:7;font:500 13px Inter,system-ui,sans-serif;color:var(--mute);overflow-x:auto;white-space:nowrap}
#trail button{background:none;border:0;padding:10px 2px;font:600 13px/20px Inter,system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;height:40px}
#trail>span{line-height:20px}
#trail .tback{color:var(--ink);padding-right:6px}
#trail .sep{width:1px;height:18px;background:rgba(0,0,0,.14);margin:0 6px 0 2px;flex:none}
#trail button.cur{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
body.hastrail #col{padding-top:140px}
body.hastrail #panel{top:92px;max-height:calc(100vh - 92px)}
body.hastrail #shade{top:92px}
#pop{position:absolute;z-index:20;width:430px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.16);padding:18px 20px 16px;font-family:Inter,system-ui,sans-serif;--c:var(--d)}
#pop .pb{display:inline-block;background:var(--d);font-size:11px;padding:4px 7px}
#pop .pr{font-weight:800;font-size:26px;line-height:1.05;text-transform:uppercase;color:var(--d);margin:8px 0 4px}
#pop .pt{font-size:13px;font-weight:500;color:var(--mute);margin-bottom:12px}
#pop .phd{font-size:14px;font-weight:600;margin-bottom:4px}
#pop .pp{font:400 17px/1.55 Lora,Georgia,serif;color:var(--ink);max-height:36vh;overflow:auto}
#pop .pq{font:italic 400 15px/1.5 Lora,Georgia,serif;color:#3a3a3c;margin-top:10px;padding-left:12px;border-left:2px solid var(--d)}
#pop .ps{font-size:12px;color:var(--mute);margin-top:10px}
#pop .pa{display:flex;gap:10px;margin-top:14px}
#pop .pa button{height:44px;padding:0 18px;border-radius:999px;font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
#pop .go{background:var(--d);color:#fff;border:0}
#pop .stay{background:none;border:1px solid rgba(0,0,0,.18);color:var(--ink)}
#popshade{position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:19}
.wfoot{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;margin-top:24px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;font-weight:500;color:var(--mute)}
.wfoot a{color:var(--ink);font-weight:600;padding:6px 0}
.wfoot .tr{margin-right:auto}
.rbar{justify-content:flex-start;gap:20px;position:sticky}
.rbar .tabs{margin-left:auto;display:flex;gap:22px;height:100%}
.rbar .tabs a{display:flex;align-items:center;height:100%;box-sizing:border-box;border-bottom:2px solid transparent;border-top:2px solid transparent}
.rbar .tabs a.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
#refc{max-width:1320px;margin:0 auto;padding:44px 60px 80px}
#refc h1{font-weight:800;font-size:44px;line-height:1;text-transform:uppercase;letter-spacing:.01em;margin:0 0 10px}
#refc .lead{font-size:16px;line-height:1.5;color:var(--mute);max-width:640px;margin:0 0 28px}
#refc svg text{font-family:Inter,system-ui,sans-serif}
#refc svg a{cursor:pointer}
#refc .foot{font-size:13px;line-height:1.6;color:var(--mute);margin-top:18px}
.trow{display:grid;grid-template-columns:136px 1fr;align-items:baseline;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.trow .y{font-size:13px;font-weight:500;color:var(--mute)}
.trow .nm{font-weight:800;font-size:17px;line-height:1.1;text-transform:uppercase}
.tgap{font-size:13px;font-weight:500;color:var(--mute);padding:14px 0;text-align:center;border-bottom:1px solid rgba(0,0,0,.05);background:#F5F5F7}
.qlay{display:flex;flex-wrap:wrap;gap:20px 56px;align-items:flex-start}
.qlay svg{flex:none;max-width:100%;height:auto}
.qp{flex:1;min-width:260px;max-width:400px;padding-top:60px;font-size:15px;line-height:1.5}
.qp h3{font-weight:800;font-size:28px;line-height:1;text-transform:uppercase;margin:8px 0 4px}
.qp h4{font-size:13px;font-weight:600;color:var(--mute);margin:16px 0 4px}
.qp ul{margin:0;padding:0}
.qp li{list-style:none;display:flex;justify-content:space-between;border-bottom:1px solid rgba(0,0,0,.05)}
.qp li button{background:none;border:0;padding:5px 0;font:600 15px Inter,system-ui,sans-serif;cursor:pointer}
.qp .open{display:inline-block;margin-top:18px;font-weight:600;padding:6px 0}
.qsel{display:none;width:100%;height:44px;margin:0 0 14px;font:500 16px Inter,system-ui,sans-serif;border:1px solid rgba(0,0,0,.2);border-radius:10px;padding:0 10px;background:#fff;color:var(--ink)}
.src{max-width:700px;font-size:17px;line-height:1.6}
.src h2{font-size:17px;font-weight:600;margin:34px 0 8px}
.src a{text-decoration:underline;text-underline-offset:3px}
.src ul{padding-left:20px}
#map{position:fixed;inset:0;background:#fff;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;overflow:hidden;opacity:0;transition:opacity .2s}
#mapbox{position:relative;flex:none}
#map.on{opacity:1}
#mapin{position:absolute;left:0;top:0;transform-origin:0 0}
#mapin .n{opacity:.13;transition:opacity .3s}
#mapin .band{opacity:.2}
#mapin .n.lit{opacity:1}
#mapsvg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#mapsvg line{stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)}
#map .cap{text-align:center;font:600 17px Inter,system-ui,sans-serif;color:var(--mute);padding:0 16px}
#map .cap b{font-weight:700}

@media(max-width:700px){
 #col{font-size:18px;line-height:1.62;padding-top:84px}
 .bar{padding:0 16px}
 .head{font-size:40px}.head.full{font-size:56px}
 section+section{margin-top:60px}section.newbook{margin-top:96px}
 .about dl{grid-template-columns:74px 1fr}
 .back,.sp{min-width:70px}
 #refc{padding:28px 20px 60px}#refc h1{font-size:36px}
 .rbar{gap:10px}.rbar .tabs{gap:14px;font-size:14px}
 .qp{padding-top:0;max-width:none}.qsel{display:block}
 .wfoot{margin-top:30px}.wfoot .tr{width:100%;margin-right:0}
 .echo{min-width:70px}.echo .dk{display:none}.echo .ph{display:inline}
 body.hastrail #col{padding-top:124px}
 #trail{padding:0 16px}
 #pop{position:fixed;left:0!important;right:0;bottom:0;top:auto!important;width:auto;max-width:none;border-radius:18px 18px 0 0;border-bottom:0;padding:20px 20px 26px}
}
@media(min-width:701px){#popshade{display:none!important}}
::view-transition-group(bookname){animation-duration:.5s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s}
@media(prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>
</head>
<body>
<main id="wall" aria-label="Books of the Bible"></main>
<div id="read" hidden>
  <header class="bar">
    <a class="back" href="#" id="back">&#8249; Books</a>
    <button class="where" id="where" aria-expanded="false" aria-controls="panel"></button>
    <button class="echo" id="echo" type="button" aria-pressed="true"></button>
  </header>
  <nav id="trail" aria-label="Trail" hidden></nav>
  <div id="shade" hidden></div>
  <div id="panel" hidden></div>
  <article id="col"></article>
</div>
<div style="position:absolute;left:0;top:0;width:0;height:0;overflow:hidden" aria-hidden="true"><span id="meas" class="n"></span></div>
<div id="ref" hidden>
  <header class="bar rbar">
    <a class="back" href="#" id="rback">&#8249; Books</a>
    <nav class="tabs" aria-label="Reference"><a href="#timeline" data-t="timeline">Timeline</a><a href="#quotations" data-t="quotations">Quotations</a><a href="#sources" data-t="sources">Sources</a></nav>
  </header>
  <main id="refc"></main>
</div>
<div id="map" hidden aria-hidden="true"></div>
<div id="popshade" hidden></div>
<div id="pop" role="dialog" aria-label="Linked passage" hidden></div>

const INTROS={"genesis":{"author":"Moses, by tradition, who probably brought together accounts handed down from earlier times.","authorDetail":{"critical":"Modern scholars think that several writers and editors produced it, much later than Moses.","conservative":"Conservative scholars cite verses on Moses writing, such as Numbers 33:2, Deuteronomy 31:24, and John 5:46. Moses could have gathered older accounts of events long before his time."},"written":"By tradition, in the time of Moses, for the Israelites he led through the wilderness.","writtenDetail":{"critical":"Most scholars date its final form after the captivity in Babylon, 586 to 538 BC, possibly the 5th century BC.","conservative":"Conservative scholars hold that Moses wrote it, citing Numbers 33:2, Deuteronomy 31:24, and John 5:46. He wrote for the Israelites he led, and he probably gathered stories passed down from earlier times."},"whatItIs":"A narrative that begins with creation, then tells of the flood and the families of Abraham, Isaac, Jacob, and Joseph. It ends with Joseph's death in Egypt, where Jacob's family now lives.","review":"draft"},"exodus":{"author":"Moses, by tradition, wrote most of it. Some details were added later, and some wording appears to have been updated.","authorDetail":{"critical":"By the end of the 1800s, scholars had given up the view that Moses wrote it. Contradictions and repeated passages in the first five books of the Bible led them to this.","conservative":"Conservative scholars hold that Moses is best seen as the main writer, as with the other four books of Moses. They accept that some details were clearly added later."},"written":"By tradition, in the lifetime of Moses.","writtenDetail":{"critical":"Modern scholars think it was first composed in the captivity in Babylon, 586 to 538 BC. They date its final revisions to the 5th century BC.","conservative":"Conservative scholars hold that Moses wrote most of it, in his lifetime. A common view dates Israel's exit from Egypt to about 1446 BC, but some prefer about 1260 BC."},"whatItIs":"A narrative of Israel's escape from slavery in Egypt and its journey to Mount Sinai. There God gives the law, and Moses sets up the tabernacle.","review":"draft"},"leviticus":{"author":"Moses, by tradition, as its source and main author.","authorDetail":{"critical":"Most scholars think two related schools of priestly writers produced chapters 1 to 16 and chapters 17 to 26.","conservative":"Conservative scholars hold that Moses is best seen as its source and main writer, as with each book of Moses. Leviticus carries on the story of Exodus."},"written":"By tradition, in the lifetime of Moses. The laws were given at Mount Sinai within one month, in the second year after Israel left Egypt.","writtenDetail":{"critical":"Most scholars place the final form of the five books of Moses under Persian rule, 539 to 332 BC. Leviticus grew over a long time before that.","conservative":"Conservative scholars hold that Moses was its source and main writer, so it comes from his lifetime. The Lord gave its laws at Mount Sinai, which a common view dates to about 1446 BC."},"whatItIs":"A book of laws on offerings, priests, purity, and feasts, given by God to Moses. The setting is the Tent of Meeting at Mount Sinai.","review":"draft"},"numbers":{"author":"Moses, by tradition, as its source and main author.","authorDetail":{"critical":"Scholars often trace the first five books of the Bible to four sources. They generally see each source as the work of a school of writers, not one person.","conservative":"Conservative scholars keep the traditional view that Moses is the source and main writer of Numbers."},"written":"By tradition, in the lifetime of Moses.","writtenDetail":{"critical":"Most modern scholars think the first five books of the Bible reached their present form after about 520 BC.","conservative":"Conservative scholars hold that Moses was its source and main writer, so it comes from his lifetime. It tells of about 40 years, from Mount Sinai to the Jordan River."},"whatItIs":"A narrative with laws, following Israel through the wilderness from Mount Sinai to the plains of Moab. It takes its name from two counts of the people.","review":"draft"},"deuteronomy":{"author":"Moses, by tradition, apart from the account of his death at the end.","authorDetail":{"critical":"Nearly all secular scholars reject the view that Moses wrote it. So do most scholars who are Christian or Jewish.","conservative":"Conservative scholars hold that the book is mainly sermons that Moses preached to Israel shortly before he died."},"written":"By tradition, near the end of the 40 years in the wilderness, shortly before Moses died.","writtenDetail":{"critical":"Nearly all secular scholars date it from the 7th to 5th century BC, as do most Christian and Jewish scholars. Most scholars place its core of laws, chapters 12 to 26, in the 7th century BC.","conservative":"Conservative scholars hold that Moses gave these sermons on the plains of Moab, about 1406 BC. That was shortly before he died, as Israel waited to enter Canaan."},"whatItIs":"Speeches of Moses that retell Israel's journey and restate the law before the people enter Canaan. It ends with the death of Moses.","review":"draft"},"joshua":{"author":"The book does not name its author, though it mentions Joshua writing. An older view, from Jewish tradition, names Joshua, except for the last verses.","written":"By tradition, in the lifetime of Joshua, except the last verses.","writtenDetail":{"critical":"Scholars now generally agree it was part of a history from Deuteronomy to Kings, first written under King Josiah. They date that first form near the end of the 7th century BC and a heavy revision to the 6th.","conservative":"Conservative scholars hold that the writing probably began long before the captivity in Babylon, 586 to 538 BC. Notes on what remains to this day suggest it was finished long after the events, perhaps in the captivity."},"whatItIs":"A narrative of how Israel, led by Joshua, takes Canaan and divides the land among the tribes. It ends with Joshua's farewell and death.","review":"draft"},"judges":{"author":"Scripture names no author. An older view names Samuel.","authorDetail":{"critical":"Since about 1950, most scholars see Judges as part of one history from Deuteronomy to Kings. Scholars agree that the editors of that history shaped its repeated pattern of sin, oppression, and rescue.","conservative":"Conservative scholars note that Scripture names no writer. They hold that the book was probably mostly complete by the reign of King David, 1010 to 970 BC."},"written":"Most of it was probably written by the time of King David, 1010 to 970 BC.","whatItIs":"A narrative of Israel after the death of Joshua, when leaders called judges rescued the tribes from enemies. It ends in civil war, in days when Israel had no king.","review":"draft"},"ruth":{"author":"The book names no author. An older view, from Jewish tradition, names Samuel.","written":"Some time after David became king, about 1010 BC, since it names David and his family line.","writtenDetail":{"critical":"A substantial number of scholars place it under Persian rule, 539 to 332 BC. Its open attitude to foreigners suggests the 5th century BC, when marriage to foreigners was disputed.","conservative":"Conservative scholars hold that it was written some time after David became king, about 1010 BC. The book names David and his family line in 4:17 to 22."},"whatItIs":"A narrative about the widow Naomi, Ruth from Moab, and Boaz of Bethlehem. It is set when the judges ruled, before about 1050 BC, and ends with the family line of David.","review":"draft"},"1-samuel":{"author":"The author is not known. An older view names Samuel, Gad, and Nathan.","written":"Probably soon after the end of David's reign, about 970 BC.","writtenDetail":{"critical":"Most scholars see it as part of a history from Deuteronomy to Kings, composed about 630 to 540 BC.","conservative":"Conservative scholars hold that 1 and 2 Samuel were probably written shortly after David's reign ended, about 970 BC."},"whatItIs":"A narrative of Israel's move from judges to kings, told through Samuel, Saul, and the young David. It runs from the birth of Samuel to the death of Saul.","review":"draft"},"2-samuel":{"author":"The author is not known. An older view names Gad and Nathan.","written":"Probably soon after the end of David's reign, about 970 BC.","writtenDetail":{"critical":"Most scholars see it as part of a history from Deuteronomy to Kings, composed about 630 to 540 BC.","conservative":"Conservative scholars hold that 1 and 2 Samuel were probably written shortly after David's reign ended, about 970 BC."},"whatItIs":"A narrative of the reign of King David, 1010 to 970 BC, over Judah and then all Israel. It opens with David's lament for Saul and Jonathan and closes as a plague on Israel ends.","review":"draft"},"1-kings":{"author":"The book does not name its writer. An older view names Ezra as the compiler, and a tradition names Jeremiah.","authorDetail":{"critical":"The most common view today sees Kings as the close of one long history. Its language and ideas reflect Deuteronomy, and scholars tend to find at least two editions.","conservative":"Conservative scholars hold that no one knows who wrote 1 and 2 Kings, or how many writers there were."},"written":"By tradition, in the 6th century BC, after Babylon took Jerusalem.","writtenDetail":{"critical":"Scholars tend to see a first edition under King Josiah in the late 7th century BC. A final edition followed in the middle of the 6th century BC.","conservative":"Conservative scholars see 1 and 2 Kings as written to answer questions raised when Babylon took Jerusalem in 586 BC."},"whatItIs":"A narrative of Israel and Judah under their kings, from Solomon's anointing to the reign of Ahab's son Ahaziah. It tells of the temple, the split into two kingdoms, and the prophet Elijah.","review":"draft"},"2-kings":{"author":"The book does not name its writer. An older view names Ezra as the compiler, and a tradition names Jeremiah.","authorDetail":{"critical":"The most common view today sees Kings as the close of one long history. Its language and ideas reflect Deuteronomy, and scholars tend to find at least two editions.","conservative":"Conservative scholars hold that no one knows who wrote 1 and 2 Kings, or how many writers there were."},"written":"By tradition, the 6th century BC. That is after King Jehoiachin was freed and before Cyrus let the captives in Babylon go home in 538 BC.","writtenDetail":{"critical":"Scholars tend to see a first edition under King Josiah in the late 7th century BC. A final edition followed in the middle of the 6th century BC.","conservative":"Conservative scholars see 1 and 2 Kings as written to answer questions raised when Babylon took Jerusalem in 586 BC."},"whatItIs":"A history of the kings who ruled Israel and Judah after Ahab died, up to the fall of Jerusalem. It ends with King Jehoiachin freed from prison in Babylon.","review":"draft"},"1-chronicles":{"author":"The book does not name its writer, a priest or Levite, a helper of the priests in the temple. An older view names Ezra.","authorDetail":{"critical":"Many now think it unlikely that the writer of Chronicles also wrote the story parts of Ezra and Nehemiah.","conservative":"Conservative scholars hold that the writer was a priest or a Levite, a helper of the priests in the temple. Known as the Chronicler, he was a trained scribe who could use the temple records."},"written":"In the Persian period, 539 to 332 BC, after the Jews came back from Babylon. An older view gives the 5th century BC.","writtenDetail":{"critical":"Critics suggest a date probably between about 400 and 250 BC, with 350 to 300 BC the most likely.","conservative":"Conservative scholars hold that the writer served in the temple under Persian rule, 539 to 332 BC. He wrote for the Jews who had come back from Babylon and rebuilt the temple."},"whatItIs":"Family lists from Adam to Israel's tribes, then the reign of King David, 1010 to 970 BC. It was written for the Jews who came back from captivity in Babylon, 586 to 538 BC.","review":"draft"},"2-chronicles":{"author":"The book does not name its writer, a priest or Levite, a helper of the priests in the temple. An older view names Ezra.","authorDetail":{"critical":"Many now think it unlikely that the writer of Chronicles also wrote the story parts of Ezra and Nehemiah.","conservative":"Conservative scholars hold that the writer was a priest or a Levite, a helper of the priests in the temple. Known as the Chronicler, he was a trained scribe who could use the temple records."},"written":"In the Persian period, 539 to 332 BC, after the Jews came back from Babylon. An older view gives the 5th century BC.","writtenDetail":{"critical":"Critics suggest a date probably between about 400 and 250 BC, with 350 to 300 BC the most likely.","conservative":"Conservative scholars hold that the writer served in the temple under Persian rule, 539 to 332 BC. He wrote for the Jews who had come back from Babylon and rebuilt the temple."},"whatItIs":"A history of King Solomon and the kings of Judah, up to the fall of Jerusalem. It ends as Cyrus king of Persia lets the captives in Babylon go back to build the temple.","review":"draft"},"ezra":{"author":"The book does not name its writer, but Ezra wrote the part told in the first person. Either Ezra or a later writer may have put the parts together.","authorDetail":{"critical":"Most scholars are now wary of treating Ezra, Nehemiah, and Chronicles as one unified work with a single viewpoint. Each is increasingly seen as the result of many stages of editing.","conservative":"The first person part, 7:27 to 9:15, comes from Ezra himself. Many scholars hold that one writer produced Ezra, Nehemiah, and 1 and 2 Chronicles."},"written":"The date of writing is not known. The events in the book end in the 5th century BC.","whatItIs":"A history of the Jews who returned from the captivity in Babylon, 586 to 538 BC, and rebuilt the temple. Then Ezra the scribe leads more home and deals with marriages to foreign women.","review":"draft"},"nehemiah":{"author":"The book uses Nehemiah's own records, but he did not write all of it. An older view names Nehemiah as the author of nearly all of it.","authorDetail":{"critical":"Whether Nehemiah's account in his own voice is genuine is now very controversial. Minimalists, scholars who accept little of the story as history, doubt that he existed.","conservative":"Conservative scholars hold that the book uses some of Nehemiah's own records, but he did not write all of it. The same writer probably wrote parts of Ezra also."},"written":"By tradition, the 5th century BC, probably after Nehemiah's second visit to Jerusalem.","writtenDetail":{"critical":"Ezra and Nehemiah as one book may have had a first edition early in the 4th century BC."},"whatItIs":"Much of the book is in Nehemiah's own voice. He rebuilds the wall of Jerusalem after he arrives in 445 BC, then reforms the temple, the Sabbath, and marriage.","review":"draft"},"esther":{"author":"The book does not name its writer. The writer may have been someone like Mordecai, able to use court records.","written":"By tradition, probably the 5th century BC, after the death of King Xerxes.","writtenDetail":{"critical":"The usual date for the book is the 4th century BC."},"whatItIs":"A story set at Susa in the reign of King Xerxes of Persia. Esther, a Jewish queen, stops a plan by Haman to destroy the Jews, and the feast of Purim begins.","review":"draft"},"job":{"author":"The book does not name its writer, who was an Israelite. An older view names Moses as perhaps the most likely writer.","authorDetail":{"critical":"It is widely held that a different writer added the speeches of Elihu later, because their style differs. Recent work leans more toward reading the book as one edited whole.","conservative":"Conservative scholars hold that the writer was an Israelite whose name is not known. In the book, Job knows the LORD, fears God, and lives as the wisdom books of Israel teach."},"written":"The date is not certain, and the story seems set in the age of Abraham, Isaac, and Jacob. An older view gives the time of Moses or of David and Solomon.","writtenDetail":{"critical":"Its Hebrew is from after the captivity in Babylon, 586 to 538 BC, with words and forms from Aramaic. Aramaic grew into a main language under Persian rule, 539 to 332 BC, which points to that time."},"whatItIs":"A long poem in dialogue, set between a prose opening and close. Job, a righteous man who loses his children and wealth, argues with three friends, and then God answers him.","review":"draft"},"psalms":{"author":"The psalms have many writers. David wrote about half, and others are linked to Asaph, the sons of Korah, Solomon, and Moses.","authorDetail":{"critical":"Modern scholars do not accept as history that David wrote the psalms. They see the names as a way to tie the writings to famous figures.","conservative":"Conservative scholars hold that about half of the psalms come from David himself. They also link psalms to Asaph, the sons of Korah, Solomon, and Moses."},"written":"By tradition, over many centuries, from the time of Moses to the time of Ezra.","writtenDetail":{"critical":"The psalms were written over at least five centuries, from the 10th to the 5th century BC or later. Scholars of the Septuagint, the early Greek translation, argue that the collection stayed open until the 1st century AD.","conservative":"Conservative scholars hold that the psalms come from many periods of Israel's history. The heading of Psalm 90 names Moses, long before David."},"whatItIs":"A collection of 150 songs and prayers in five books, with praise, laments, and thanks. Israel sang them in worship.","review":"draft"},"proverbs":{"author":"Solomon wrote or collected much of it, by the book's own account. It also has sayings of the wise and of Agur and Lemuel.","authorDetail":{"critical":"The heading Proverbs of Solomon comes at 1:1, 10:1, and 25:1. It sorts the material into groups rather than naming an author.","conservative":"The book itself names Solomon as author or collector at 1:1 and 10:1. At 25:1 it says that the men of Hezekiah copied more of his proverbs."},"written":"Begun under Solomon in the 10th century BC, and probably complete in its present form under Hezekiah, about 700 BC.","writtenDetail":{"critical":"Some argue that the sections differ in date, and chapters 1 to 9 and 30 to 31 are the latest. They put the final editing late in Persian rule, 539 to 332 BC, or under Greek rule, from 332 BC.","conservative":"Conservative scholars hold that Proverbs was begun under Solomon, about 971 to 931 BC, as the book itself says. It probably reached its present form under Hezekiah, whose men copied more proverbs."},"whatItIs":"Short wise sayings and longer poems that teach the way of wisdom. Much is addressed to a son, and it ends with a poem about a wife of noble character.","review":"draft"},"ecclesiastes":{"author":"The writer calls himself the Teacher, son of David and king in Jerusalem, but gives no name. Tradition names Solomon.","authorDetail":{"critical":"Critical scholars have long rejected any date before the captivity in Babylon, 586 to 538 BC. Words borrowed from Persian and Aramaic point to no earlier than about 450 BC, long after Solomon."},"written":"By tradition, in the time of Solomon.","writtenDetail":{"critical":"Critical scholars date it between about 450 BC and 180 BC, the year Ben Sira, a Jewish writer, quotes it. They differ over whether it shows Greek thought, which would point to Greek rule, from 332 BC."},"whatItIs":"A book in which the Teacher, a king in Jerusalem, searches for meaning and finds everything futile. It closes by telling the reader to fear God and obey his commands.","review":"draft"},"song-of-solomon":{"author":"Solomon was probably not the writer, and the song may have been made in his honor. An older view names Solomon as the author.","written":"Probably in the time of Solomon, perhaps under his oversight, in the 10th century BC.","writtenDetail":{"critical":"Most scholars since the 1800s place the song in the 3rd century BC, chiefly because of its language. Others doubt that the language requires a date after the return from Babylon, late in the 6th century BC.","conservative":"Conservative scholars think that the song was probably written while Solomon was king, and he may have overseen it. These scholars give about 960 to 931 BC as the probable years of the writing."},"whatItIs":"Love poems, spoken in turn by a young woman and the man she loves. The daughters of Jerusalem listen, and she warns them not to stir up love too soon.","review":"draft"},"isaiah":{"author":"Isaiah son of Amoz, by tradition.","authorDetail":{"critical":"Scholars widely accept that the prophet Isaiah did not write the whole book. Few scholars today credit one person with all of it, or even most of it.","conservative":"Conservative scholars treat the prophet Isaiah as the writer, from about 740 BC until after 681 BC. They read chapters 40 to 55 as his prophecies for the captivity in Babylon, 586 to 538 BC."},"written":"By tradition, the late 8th and early 7th centuries BC. Isaiah was called about 740 BC and outlived the Assyrian king Sennacherib.","writtenDetail":{"critical":"Much of the book shows signs of writing after Babylon took Judah's leaders captive in 586 BC, or later still. For most of the 20th century, scholars agreed that chapters 40 to 55 date from that captivity.","conservative":"Conservative scholars read chapters 40 to 55 as prophecies for the 500s BC, when God's people were captives in Babylon."},"whatItIs":"Prophecy about judgment and comfort for Judah and Jerusalem. It speaks of the Assyrian threat, the people taken captive to Babylon, and their return home.","review":"draft"},"jeremiah":{"author":"Jeremiah son of Hilkiah, a priest of Anathoth, by tradition, with his scribe Baruch.","authorDetail":{"critical":"Scholars generally agree that the book mixes material from different groups of writers. His own messages are probably the poems in chapters 1 to 25, and followers and later editors added much.","conservative":"Conservative scholars hold that Jeremiah and his scribe Baruch left the record. The book names Baruch as his scribe in several places."},"written":"By tradition, the late 7th and early 6th centuries BC. Jeremiah is thought to have added some chapters later, in Egypt.","whatItIs":"Prophecies of judgment and hope that Jeremiah spoke to Judah and the nations, with stories from his life. Its last chapter tells how Babylon burned Jerusalem and took its people captive.","review":"draft"},"lamentations":{"author":"The author is not known. An older view names Jeremiah.","written":"Probably soon after Babylon destroyed Jerusalem about 586 BC, by an eyewitness. An old tradition places the writing in a cave outside Jerusalem.","whatItIs":"Five poems that mourn the fall of Jerusalem and its temple and confess the sin of its people. The last poem is a prayer that God will restore his people.","review":"draft"},"ezekiel":{"author":"Ezekiel the priest, son of Buzi, by tradition. He was among the people of Judah taken captive to Babylon.","authorDetail":{"critical":"The book took shape through a long, complex process and may not keep the prophet's exact words. Scholars do agree that Ezekiel himself wrote the prophecy down.","conservative":"The book dates its messages over about 22 years, from about 593 BC. Ezekiel wrote down what he saw and heard while he lived as a captive near Babylon."},"written":"By tradition, the early 6th century BC, near Babylon, where Ezekiel lived as a captive.","whatItIs":"Prophecy and visions given to the people of Judah held captive in Babylonia. The book moves from judgment on Jerusalem and the nations to a vision of a new temple and land.","review":"draft"},"daniel":{"author":"Daniel, a young man of Judah taken captive to serve at the court in Babylon, by tradition.","authorDetail":{"critical":"The stories in chapters 1 to 6 began as legends. Unnamed writers of the 2nd century BC produced the visions in chapters 7 to 12.","conservative":"Conservative scholars hold that Daniel himself wrote the book in the 500s BC. It covers his life and visions from his capture in 605 BC to 536 BC."},"written":"By tradition, the 6th century BC. The book covers Daniel's life from when he was taken to Babylon about 605 BC to about 536 BC.","writtenDetail":{"critical":"A consensus of modern scholars dates the book to about 165 BC, under the Greek king Antiochus IV. They read its predictions as written after the events.","conservative":"Conservative scholars read chapters 8, 9, and 12 as prophecy of later troubles, such as harm to the temple."},"whatItIs":"Stories of Daniel at the court in Babylon, then visions of kingdoms to come and the time of the end. The stories are set under Babylonian and Persian kings.","review":"draft"},"hosea":{"author":"Hosea son of Beeri, by tradition.","written":"By tradition, the late 8th century BC, just before the northern kingdom of Israel fell.","whatItIs":"Prophecy that compares the unfaithfulness of Israel to God with the marriage of Hosea to an unfaithful wife. It closes with a call to return to God.","review":"draft"},"joel":{"author":"Joel son of Pethuel, a prophet from Judah, by tradition. Little is known about him.","authorDetail":{"critical":"The book shows signs of growth over time, with material added at later stages. Some influential scholars hold that it is one piece of work.","conservative":"Conservative scholars treat Joel, a prophet from Judah, as the writer of the book. Little is known about him, and he may have come from Jerusalem."},"written":"Probably after Judah's people came home from the captivity in Babylon, 586 to 538 BC, perhaps about 500 BC. An older view places Joel about 800 BC, when Uzziah was king.","writtenDetail":{"critical":"Its many echoes of earlier scripture point to a late origin. Some scholars think parts were added as late as the 3rd century BC.","conservative":"Conservative scholars agree with most scholars that the book is later than 586 BC, when Babylon took Judah captive."},"whatItIs":"Prophecy about a plague of locusts and a call to turn back to God. It looks ahead to a coming day of the LORD and to judgment on the nations.","review":"draft"},"amos":{"author":"Amos, a herdsman from Tekoa, by tradition. He was not a prophet by trade.","authorDetail":{"critical":"Scholars have lately grown more doubtful about the book's account of the life of Amos. Prophetic books are more and more seen as made by trained writers, so the prophet may not be the author.","conservative":"Conservative scholars accept the book's own account of Amos at 1:1 and 7:14 to 15. He was not a prophet by trade, but the Lord sent him with a message."},"written":"By tradition, the 8th century BC, when Uzziah ruled Judah and Jeroboam II ruled Israel. Amos took his message to the northern kingdom.","writtenDetail":{"critical":"The heading and the story of Amos and the priest Amaziah are increasingly seen as written after his time. The vision reports may belong to a later phase as well.","conservative":"Conservative scholars date the preaching of Amos between 793 and 739 BC, probably late in that span. He preached to Israel, the northern kingdom."},"whatItIs":"Prophecy of judgment on the nations around Israel and on Israel itself. It ends with a promise that God will restore his people to their land.","review":"draft"},"obadiah":{"author":"Obadiah, by tradition. Only his name is known.","written":"Probably the 6th century BC, soon after Babylon destroyed Jerusalem about 586 BC.","writtenDetail":{"critical":"The majority of scholars date it soon after Jerusalem fell to Babylon, in the 6th century BC. Some scholars think it took shape over time, amid conflicts with Edom in the 5th and 4th centuries BC.","conservative":"Conservative scholars place it early in the captivity in Babylon, 586 to 538 BC. That is before Babylon attacked Edom in 553 BC."},"whatItIs":"A short prophecy against Edom, which sided with the enemies of Jerusalem. It ends with a promise of rescue on Mount Zion and of a kingdom that belongs to the LORD.","review":"draft"},"jonah":{"author":"Jonah son of Amittai, by tradition.","written":"By tradition, the 8th century BC, when Jeroboam II ruled Israel.","writtenDetail":{"critical":"Most scholars think it was written long after the events, since it uses words known only from much later writings. Mainstream scholars generally read the story as fiction.","conservative":"Conservative scholars place the prophet Jonah in the reign of Jeroboam II over Israel, 782 to 753 BC. They point to 2 Kings 14:23 to 28."},"whatItIs":"A story about the prophet Jonah, who flees when God sends him to warn Nineveh. When the city repents and God spares it, Jonah is angry.","review":"draft"},"micah":{"author":"Micah the Moreshite, by tradition.","authorDetail":{"critical":"Some scholars, though not all, hold that only chapters 1 to 3 go back to Micah himself.","conservative":"Conservative scholars hold that the prophet Micah wrote the book. They credit passages from chapters 1 to 7 to him."},"written":"By tradition, the late 8th and early 7th centuries BC, while Jotham, Ahaz, and Hezekiah ruled Judah.","writtenDetail":{"critical":"Scholars agree its last stage came under Persian rule, 539 to 332 BC, or even Greek rule, from 332 BC. They dispute how much took shape then, and date the latest parts after the temple's rebuilding in 515 BC.","conservative":"Conservative scholars place Micah's work under three kings of Judah, Jotham, Ahaz, and Hezekiah, from 750 to 687 BC. His public work may have lasted about 20 to 25 years."},"whatItIs":"Prophecy against the sins of Samaria and Jerusalem, with promises of hope. It ends with trust that God will pardon sin and keep faith with Jacob and Abraham.","review":"draft"},"nahum":{"author":"The prophet Nahum, by tradition. The book names him as Nahum the Elkoshite.","written":"By tradition, the 7th century BC, after Thebes in Egypt fell and before Nineveh fell. An older view dates it to the 8th century BC, probably in Jerusalem.","writtenDetail":{"critical":"Scholars debate when the book took shape. Proposals run from soon after 663 BC to about 175 to 165 BC.","conservative":"Conservative scholars note that the book treats the fall of Thebes as past and the fall of Nineveh as future. So it dates from the 7th century BC."},"whatItIs":"A prophecy that Nineveh, the chief city of Assyria, will fall. It tells Judah that this enemy will not invade again.","review":"draft"},"habakkuk":{"author":"The prophet Habakkuk, by tradition. The book names him in its first verse and at the head of chapter 3.","authorDetail":{"critical":"Scholars debate whether chapter 3 has the same author as chapters 1 and 2, or was added later. Every copy of the Septuagint, the Greek translation finished by 132 BC, includes it.","conservative":"Conservative scholars treat the prophet Habakkuk as the writer of all three chapters. They read the closing prayer of praise as his own response to God."},"written":"By tradition, late in the 7th century BC, shortly before Babylon invaded Judah. An older view dates it a little earlier, in the mid 7th century BC.","whatItIs":"A dialogue in which the prophet questions the Lord about injustice and hears his answers. It ends with a prayer set for stringed instruments.","review":"draft"},"zephaniah":{"author":"The prophet Zephaniah, son of Cushi, by tradition.","written":"By tradition, while Josiah was king of Judah, in the 7th century BC.","writtenDetail":{"critical":"Some scholars keep the time of Josiah. Others think editors expanded an early core of messages after Judah fell in 586 BC, or later still.","conservative":"Conservative scholars place the prophet Zephaniah in the reign of Josiah over Judah, 640 to 609 BC."},"whatItIs":"A prophecy about the day of the Lord, when he will judge Judah and other nations. It ends with a promise to gather and restore the people.","review":"draft"},"haggai":{"author":"The prophet Haggai, by tradition.","written":"By tradition, about 520 BC, after the Jews returned from Babylon in 538 BC.","whatItIs":"Dated messages from the second year of King Darius that urge the people to rebuild the house of the Lord. They speak to Zerubbabel the governor, Joshua the high priest, and the people.","review":"draft"},"zechariah":{"author":"The prophet Zechariah, a priest, by tradition.","authorDetail":{"critical":"Most modern scholars think at least two writers produced the book. Some think a disciple of the prophet wrote or edited chapters 9 to 14.","conservative":"Conservative scholars treat the prophet Zechariah, who was also a priest, as the writer of the book."},"written":"By tradition, from about 520 BC, after the people of Judah returned from Babylon in 538 BC.","writtenDetail":{"critical":"Most scholars date chapters 9 to 14 to the 5th century BC, well after chapters 1 to 8. Those later chapters name no event that can be dated.","conservative":"Conservative scholars date the start of his work to 520 BC, soon after Haggai began to prophesy. Judah's people had come home from Babylon in 538 BC."},"whatItIs":"Night visions and messages that call the people back to the Lord, then two prophecies about Jerusalem and the nations. The book opens in the second year of King Darius.","review":"draft"},"malachi":{"author":"The prophet Malachi, by tradition. His name means my messenger.","authorDetail":{"critical":"Some scholars think the writer is unknown and that Malachi, meaning my messenger, is a title rather than a name. Others argue from the grammar that it is a name.","conservative":"Conservative scholars treat Malachi as the name of the prophet behind the book. The name means my messenger."},"written":"By tradition, about 460 BC, when Ezra and Nehemiah lived.","writtenDetail":{"critical":"Most scholars think editors added to the book in several stages. Its oldest parts date to about 500 BC, and it was almost complete by about 180 BC.","conservative":"Conservative scholars date Malachi probably to about 460 BC, when Ezra and Nehemiah lived. He worked decades after the exiles came home from Babylon and rebuilt the temple."},"whatItIs":"A set of disputes between the Lord and Israel about worship, marriage, and offerings. It ends with a call to remember the law of Moses and a promise of Elijah.","review":"draft"},"matthew":{"author":"The apostle Matthew, also called Levi, a former tax collector, by tradition.","authorDetail":{"critical":"Most scholars doubt the apostle wrote it, and see it as the work of the next generation of Christians. It also draws on the Gospel of Mark, and some scholars still defend the apostle.","conservative":"Conservative scholars keep the traditional view that Matthew wrote this Gospel. He was the tax collector, also called Levi, who became a disciple of Jesus."},"written":"By tradition, about AD 60, before the fall of Jerusalem.","writtenDetail":{"critical":"Most scholars date it after AD 70, because it seems to know of the fall of Jerusalem. Other scholars argue for the 40s or 50s AD.","conservative":"Conservative scholars place the writing of this Gospel probably near AD 60, in the late 50s or the early 60s."},"whatItIs":"A Gospel account of Jesus from his birth to his death, resurrection, and command to make disciples of all nations. Its writer had Jewish Christians in mind.","review":"draft"},"mark":{"author":"John Mark, by tradition. He recorded the reports about Jesus that the apostle Peter passed on to him.","authorDetail":{"critical":"The book does not name its writer, and scholars debate who wrote it. Some deny that anyone named Mark wrote it, and others accept John Mark.","conservative":"Conservative scholars hold that John Mark wrote this Gospel. He wrote down Peter's witness to what Jesus said and did."},"written":"By tradition, the second half of the 50s AD, likely in Rome. A date in the middle or late 60s AD is also possible.","writtenDetail":{"critical":"Scholars usually date it just before or just after AD 70. Chapter 13 seems to reflect the Jewish war with Rome, AD 66 to 74.","conservative":"Conservative scholars think Mark was likely written in Rome in the middle or late 50s AD. They also allow a date in the middle or late 60s AD."},"whatItIs":"A Gospel account that begins when John baptizes Jesus and ends with his death and resurrection. It explains Jewish customs for readers who did not know them.","review":"draft"},"luke":{"author":"Luke, a physician and travel companion of Paul, by tradition.","authorDetail":{"critical":"Late in the 20th century, critical scholars were about evenly split on whether Luke wrote it. Most now hold that the writer did travel with Paul, but some point to differences with his letters.","conservative":"Conservative scholars keep the traditional view that Luke wrote this Gospel and the book of Acts. Luke was a doctor who traveled with Paul."},"written":"By tradition, no earlier than about AD 62, just after the last events in Acts. An older view dates it to about AD 60 to 63, a little before Acts.","writtenDetail":{"critical":"Most scholars date it to about AD 80 to 90, after Mark and after the fall of Jerusalem.","conservative":"Conservative scholars keep the traditional view that the earliest date is about AD 62. That date comes just after the last events that Acts tells, in chapter 28."},"whatItIs":"A Gospel account of Jesus from his birth to his resurrection and his going up to heaven. The writer addresses it to a man named Theophilus.","review":"draft"},"john":{"author":"The apostle John, son of Zebedee, by tradition.","authorDetail":{"critical":"Most scholars now prefer another writer, such as John the Elder, with the disciple Jesus loved as a main source. Many still hold that the apostle wrote it.","conservative":"Conservative scholars identify the apostle John with the disciple whom Jesus loved, and hold that he wrote it."},"written":"By tradition, late in the 1st century AD, likely in Ephesus.","whatItIs":"A Gospel account of the miracles of Jesus, which it calls signs, and of his talks, death, and resurrection. Its stated witness is the disciple whom Jesus loved.","review":"draft"},"acts":{"author":"Luke, a physician and travel companion of Paul, by tradition.","authorDetail":{"critical":"Late in the 20th century, critical scholars were about evenly split on whether Luke wrote it. Most still hold that the writer travelled with Paul, but others note tensions with his letters.","conservative":"Conservative scholars keep the traditional view that Luke wrote Acts. He was a doctor and a companion of Paul on his travels, and he also wrote the Gospel of Luke."},"written":"By tradition, about AD 62, when the story in Acts ends. An older view adds that it was probably written in Rome.","writtenDetail":{"critical":"Most scholars date it to about AD 80 to 90, after the fall of Jerusalem.","conservative":"Acts ends about AD 62 with Paul still awaiting trial. Since it does not tell of his defence or release, many scholars hold that it was written then."},"whatItIs":"A history of the early church, from when Jesus went up to heaven to the time of Paul in Rome. It continues Luke and also addresses Theophilus.","review":"draft"},"romans":{"author":"Paul, by tradition.","written":"By tradition, about AD 57, probably in Corinth.","whatItIs":"A letter that explains the gospel for Jews and non-Jews, then turns to daily Christian life. Paul wrote it to the believers in Rome before he had visited them.","review":"draft"},"1-corinthians":{"author":"Paul, by tradition.","written":"By tradition, about AD 54, in Ephesus, near the end of Paul's three years there.","whatItIs":"A letter to the church in Corinth about divisions, sexual conduct, worship, and the resurrection of the dead. Paul answers news he had heard and a letter the church had sent him.","review":"draft"},"2-corinthians":{"author":"Paul, by tradition.","written":"By tradition, about AD 55 to 56, in Macedonia, about a year after 1 Corinthians.","whatItIs":"A letter in which Paul defends his work as an apostle and asks for money for poor believers in Judea. He sent it to the Corinthian church and to the believers across Achaia.","review":"draft"},"galatians":{"author":"Paul, by tradition.","written":"By tradition, about AD 48, probably from Antioch in Syria. An older view places it in Corinth in the late 50s AD.","whatItIs":"A letter in which Paul argues that non-Jewish believers do not need circumcision or the law of Moses. He wrote it to the churches of Galatia.","review":"draft"},"ephesians":{"author":"Paul, by tradition.","authorDetail":{"critical":"Many scholars doubt that Paul wrote it, because its style, words, and view of the end times differ from his. A survey in 2011 found 39 of 109 scholars for Paul, 42 against, and 28 unsure.","conservative":"Conservative scholars keep the traditional view that Paul wrote it."},"written":"By tradition, about AD 62, while Paul was in prison in Rome.","writtenDetail":{"critical":"Many scholars who doubt that Paul wrote it date it to about AD 70 to 100.","conservative":"Conservative scholars keep the traditional date of about AD 62. They place it during the house arrest of Paul in Rome, told in Acts 28."},"whatItIs":"A letter about God's plan in Christ, the church as one body, and how believers should live day to day. It opens with a greeting to the saints in Ephesus.","review":"draft"},"philippians":{"author":"Paul, by tradition.","written":"By tradition, about AD 62, while Paul was in prison, probably in Rome.","whatItIs":"A letter that thanks the church for its gifts and urges unity and joy in the Lord. Paul wrote it to the believers at Philippi while he was in chains.","review":"draft"},"colossians":{"author":"Paul, by tradition.","authorDetail":{"critical":"Many scholars think an early follower of Paul wrote it, because of its words, style, and teaching. A survey in 2011 found 56 of 109 scholars for Paul, 17 against, and 36 unsure.","conservative":"Conservative scholars keep the traditional view that Paul wrote it."},"written":"By tradition, about AD 62, during Paul's imprisonment, probably in Rome.","writtenDetail":{"critical":"A standard Bible commentary holds that Paul did not write it. It dates the letter after his lifetime, between AD 70 and 80.","conservative":"Conservative scholars keep the view that it was probably written about AD 62. Paul was then in prison, probably in Rome, when he also wrote Ephesians and Philemon."},"whatItIs":"A letter that sets Christ above all creation and warns the church against false teaching. It names Paul and Timothy as senders and greets the believers at Colossae.","review":"draft"},"1-thessalonians":{"author":"Paul, by tradition.","written":"By tradition, about AD 50, probably in Corinth.","whatItIs":"A letter of thanks and encouragement, with teaching on holy living and the coming Day of the Lord. It comes from Paul, Silvanus, and Timothy to the church of the Thessalonians.","review":"draft"},"2-thessalonians":{"author":"Paul, by tradition.","authorDetail":{"critical":"Critical commentators are about evenly split on whether Paul wrote it. A wider survey of 111 scholars in 2011 found 63 for Paul, 13 against, and 35 unsure.","conservative":"Conservative scholars keep the traditional view that Paul wrote it."},"written":"By tradition, about AD 50, soon after 1 Thessalonians. Paul was probably in Corinth.","writtenDetail":{"critical":"Scholars who think a later writer wrote it date it to about AD 80 to 115.","conservative":"Conservative scholars date it to AD 49 to 51, soon after 1 Thessalonians, with Paul probably in Corinth. Paul wrote after he heard that the church believed the day of the Lord was already here."},"whatItIs":"A letter that corrects a mistaken view about the Lord's return and warns against idle living. It names Paul, Silvanus, and Timothy as senders and goes to the church of the Thessalonians.","review":"draft"},"1-timothy":{"author":"Paul, by tradition.","authorDetail":{"critical":"Most scholars think a later Christian wrote it in Paul's name, in words and a style unlike his. A small and shrinking number of scholars still hold that Paul wrote it.","conservative":"Conservative scholars keep the traditional view that Paul wrote it."},"written":"By tradition, the 60s AD, between Paul's first and last imprisonments in Rome. The place is not known, but an older view names Macedonia.","writtenDetail":{"critical":"Most scholars date it after Paul's death, between the late 1st century and the middle of the 2nd century AD.","conservative":"Conservative scholars keep the view that Paul probably wrote it in the 60s AD. He wrote on a journey after the events in Acts, between his two imprisonments in Rome."},"whatItIs":"A letter of instruction on worship, church leaders, and false teaching. It names Paul as its writer and Timothy, at Ephesus, as its reader.","review":"draft"},"2-timothy":{"author":"Paul, by tradition.","authorDetail":{"critical":"Since the early 1800s, more and more scholars think an unknown follower of Paul wrote it in his name. A number of scholars still hold that Paul wrote it.","conservative":"Conservative scholars keep the traditional view that Paul wrote it."},"written":"By tradition, about AD 65, in Rome, while Paul was in prison for the second time, shortly before his death.","writtenDetail":{"critical":"Some critical scholars date it to about AD 90 to 140.","conservative":"Conservative scholars date it to the second prison term of Paul in Rome, probably AD 64 or 65. In chapter 4, Paul says that he expects to die soon."},"whatItIs":"A personal letter that urges Timothy to endure hardship and asks him to come quickly. It names Paul as its writer, a prisoner who expects to die soon.","review":"draft"},"titus":{"author":"The apostle Paul, by tradition.","authorDetail":{"critical":"Most scholars think all three letters to Timothy and Titus were written after Paul's death, by someone using his name.","conservative":"Conservative scholars keep the traditional view that Paul wrote it."},"written":"By tradition, the 60s AD, after the first imprisonment of Paul in Rome. The place is not known, but an older view names Nicopolis in Epirus.","writtenDetail":{"critical":"Scholars who doubt Paul wrote it date it from the 80s AD to the late 2nd century AD. Most of them place it between about AD 80 and 100.","conservative":"Conservative scholars keep the view that Paul probably wrote it in the 60s AD. That was after his first imprisonment in Rome, told in Acts 28, and before his second."},"whatItIs":"A letter from Paul to Titus, whom he left in Crete to appoint elders in each town. It also warns against false teachers and urges good works.","review":"draft"},"philemon":{"author":"The apostle Paul, by tradition.","written":"By tradition, about AD 62, while Paul was a prisoner, probably in Rome.","whatItIs":"A short personal letter from Paul, a prisoner, to Philemon and the church in his house. Paul asks him to receive Onesimus back as a dear brother, not as a slave.","review":"draft"},"hebrews":{"author":"The letter does not name its writer, and who wrote it is not known. An older view names Paul.","written":"By tradition, before AD 70, probably in Rome.","writtenDetail":{"critical":"Some scholars date it later, between AD 70 and 100.","conservative":"Conservative scholars keep the view that it was probably written before AD 70."},"whatItIs":"A long letter of encouragement that presents Jesus as greater than the angels, Moses, and the old priesthood of Israel. By tradition, its first readers were Christians who knew the Jewish faith.","review":"draft"},"james":{"author":"By tradition, James, the brother of Jesus, who led the church in Jerusalem. An older view also counts him among the twelve apostles.","authorDetail":{"critical":"A widely held view among scholars is that another writer used the name of James.","conservative":"Conservative scholars keep the traditional view that Jesus's brother James wrote it. James led the church in Jerusalem, as Acts 15 shows."},"written":"By tradition, the early 40s AD. An older view places it in Jerusalem in the early 60s AD.","writtenDetail":{"critical":"Scholars who doubt James wrote it usually date it from the late 1st to the mid 2nd century AD. But the debate now seems to lean toward an earlier date than that.","conservative":"Conservative scholars keep the view that it was probably written about AD 40 to 45."},"whatItIs":"A letter of practical teaching on trials, wisdom, speech, wealth, and faith shown by deeds. It is addressed to the twelve tribes of the Dispersion, meaning Jewish believers who lived outside Palestine.","review":"draft"},"1-peter":{"author":"The apostle Peter, by tradition.","authorDetail":{"critical":"Most scholars think it comes from a Christian circle in Rome linked to Peter, not from the apostle himself. Many note that the writer seems trained in Greek, rhetoric, and philosophy, unlike a fisherman from Galilee.","conservative":"Conservative scholars keep the traditional view that the apostle Peter wrote it. The letter names Peter as its writer, and the writer calls himself a witness of Christ's sufferings."},"written":"By tradition, the early 60s AD, probably in Rome. An older view places it in Babylon on the Euphrates.","writtenDetail":{"critical":"Most scholars think it was written after the death of Peter and the other apostles.","conservative":"Conservative scholars date it to about AD 62 or 63, under the emperor Nero, probably in Rome. In 1 Peter 5:13, they read the name Babylon as almost certainly meaning Rome."},"whatItIs":"A letter that encourages Christians to stay hopeful and faithful while they suffer. It is sent to exiles scattered through five regions of Asia Minor, in what is now Turkey.","review":"draft"},"2-peter":{"author":"The apostle Peter, by tradition.","authorDetail":{"critical":"Most critical scholars think one or more followers of Peter wrote it in his name. They cite its differences from 1 Peter, its use of Jude, and little support from early church writers.","conservative":"The letter names Peter as an apostle. The writer says he was with Jesus on the mountain and saw him in glory, at 1:16 to 18."},"written":"By tradition, the mid 60s AD, shortly before Peter died, probably from a prison in Rome.","writtenDetail":{"critical":"Scholars give dates from about AD 60 to 150. Critical scholars generally place it in the 2nd century AD.","conservative":"The writer says his death is near, so the letter comes from late in the life of Peter."},"whatItIs":"A farewell letter that warns against false teachers and answers those who mock the promise of the Lord's coming. It calls itself the second letter to its readers.","review":"draft"},"1-john":{"author":"The letter does not name its writer. By tradition, the apostle John, the son of Zebedee.","authorDetail":{"critical":"Most critical scholars hold that the apostle John wrote none of the five books that tradition credits to him.","conservative":"Conservative scholars hold that all three letters of John are probably by John, the son of Zebedee."},"written":"By tradition, about AD 85, in Ephesus, late in the life of John.","writtenDetail":{"critical":"A standard textbook dates it between about AD 95 and 110, probably in Ephesus.","conservative":"Conservative scholars date it to about AD 85, and no later than the 90s AD. John likely wrote it from Ephesus, where he had apparently moved about AD 70."},"whatItIs":"A letter about walking in the light, loving one another, and faith in Jesus as God's Son. It has no greeting, and it warns its readers against those who deny the Son.","review":"draft"},"2-john":{"author":"By tradition, the apostle John, the son of Zebedee. The writer calls himself the elder.","authorDetail":{"critical":"Most critical scholars hold that the apostle John wrote none of the five books credited to him. This letter is one of the five.","conservative":"Conservative scholars hold that all three letters of John are probably by John, the son of Zebedee."},"written":"By tradition, in Ephesus, no later than the 90s AD.","whatItIs":"A short letter from the elder to the chosen lady and her children. It urges love and warns against deceivers who deny that Jesus came in the flesh.","review":"draft"},"3-john":{"author":"By tradition, the apostle John, the son of Zebedee. The writer calls himself the elder.","authorDetail":{"critical":"Most critical scholars hold that the apostle John wrote none of the five books credited to him. This letter is one of the five.","conservative":"Conservative scholars hold that all three letters of John are probably by John, the son of Zebedee."},"written":"By tradition, in Ephesus, no later than the 90s AD.","whatItIs":"A short personal letter from the elder to Gaius. It praises his help for traveling believers and warns about Diotrephes, who refuses to welcome them.","review":"draft"},"jude":{"author":"By tradition, Jude, a brother of both James and Jesus. An older view counts him among the twelve apostles, as Judas, also called Lebbaeus and Thaddaeus.","authorDetail":{"critical":"Scholars still debate who the writer was. One view is that a later writer used the name of Jude to make the letter carry more weight.","conservative":"Conservative scholars keep the traditional view that Jude, a brother of James and of Jesus, wrote it. In Matthew 13:55, Jesus has a brother Judas, and in Greek Judas and Jude are one name."},"written":"By tradition, the mid 60s AD, apparently in Palestine.","writtenDetail":{"critical":"The date is not known, and proposals run from about AD 50 to 110. Scholars who doubt that Jude wrote it generally prefer the later dates, about AD 90 to 110 or after.","conservative":"Conservative scholars keep the view that it probably dates from the mid 60s AD. Jude and 2 Peter share material, so they are dated close together."},"whatItIs":"A short letter that calls believers to stand firm for the faith against ungodly men who crept in. It is addressed to those who are called, loved, and kept.","review":"draft"},"revelation":{"author":"By tradition, the apostle John, the son of Zebedee. The writer calls himself John.","authorDetail":{"critical":"Modern scholarship generally does not identify the writer with the apostle John. Many hold that nothing is known of him beyond his work as a Christian prophet.","conservative":"Conservative scholars keep the traditional view that the writer was John, the son of Zebedee. They hold that he also wrote the Gospel of John and the three letters of John."},"written":"By tradition, the mid 90s AD, on the island of Patmos.","whatItIs":"A book of prophetic visions, opened by letters to seven churches in Asia, a Roman province, now western Turkey. It describes the conflict between God and evil and ends with a new heaven and earth.","review":"draft"}};

(function(){

window.__BK=function(id,chapters){cache[id]=chapters;(waiting[id]||[]).forEach(function(f){f(chapters);});delete waiting[id];};

function buildSection(b,n,full,newbook){
  var ch=cache[b.id][n-1],s=el('section',newbook?'newbook':'');s.dataset.book=b.id;s.dataset.n=n;s.style.setProperty('--c',b.color);
  if(full){var bk=el('div','bk band');bk.textContent=b.label;s.appendChild(bk);}
  var hd=el('div','head'+(full?' full':''));var nm=el('div','name');nm.textContent=b.name;var nu=el('div','num');nu.textContent=n;hd.appendChild(nm);hd.appendChild(nu);
  hd.setAttribute('role','heading');hd.setAttribute('aria-level','2');s.appendChild(hd);
  var meta=el('div','meta'+(full?'':' small')),ab=full?buildAbout(b):null;if(ab)meta.appendChild(ab);
  var rw=(RW[b.id]||{})[n];
  if(rw&&rw.length){var rr=el('div','rw');rr.appendChild(el('span','rwl','Read with'));
    rw.forEach(function(e){var d=byId[e.book];if(!d)return;var bt=el('button','rwc');bt.type='button';bt.textContent=d.name+' '+e.c;bt.style.color=d.color;bt.dataset.book=e.book;bt.dataset.c=e.c;rr.appendChild(bt);});
    rr.appendChild(el('span','rws','From OpenBible.info'));meta.appendChild(rr);}
  if(meta.firstChild)s.appendChild(meta);
  var xr={};(ch.xrefs||[]).forEach(function(x){xr[x.v]=String(x.t).replace(/^\(|\)$/g,'');});
  var pend=false,blocks=ch.blocks;
  for(var i=0;i<blocks.length;i++){var bl=blocks[i];
    if(bl.k==='h'){
      if(bl.s==='ms')s.appendChild(el('div','ms',esc(bl.t)));

      else if(bl.s==='qa')s.appendChild(el('div','qa',esc(bl.t)));
      else if(bl.s==='s2')s.appendChild(el('h4','',esc(bl.t)));
