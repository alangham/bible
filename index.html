<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Bible Wall" />
    <!-- The line theme-color: the page color of the light mode, and of the dark mode of docs/DESIGN.md section 18.11.
         The script below and src/data/darkMode.ts take the value from data-light or data-dark. -->
    <meta name="theme-color" content="#ffffff" data-light="#ffffff" data-dark="#1C1C1E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bible Wall</title>
    <!-- The dark mode, before the first paint: docs/DESIGN.md section 18.3, docs/TASKS.md Task 45 step 6 and Task 46.
         With no value for the key bible-dark-mode, the mode of the device. With the value "on", dark. With a different
         value, such as "off", light. In the dark mode, the root element gets data-mode="dark", and the line theme-color
         the dark page color. src/data/darkMode.ts has the same rule. -->
    <script>
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('bible-dark-mode')
        } catch (e) {
          // A storage that fails is a storage with no value: the mode of the device.
        }
        // A browser with no matchMedia is a light device, as in src/data/darkMode.ts.
        var deviceDark = typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches
        var dark = stored === null ? deviceDark : stored === 'on'
        if (dark) {
          document.documentElement.setAttribute('data-mode', 'dark')
          var themeColor = document.querySelector('meta[name="theme-color"]')
          themeColor.content = themeColor.dataset.dark
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
