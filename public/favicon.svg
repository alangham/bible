<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Bible Wall</title>
  <!-- The ten groups of the wall, in Bible order: Law; History; Poetry and Wisdom; Major Prophets; Minor Prophets; Gospels; History, Acts; Letters of Paul; General Letters; Prophecy. docs/DESIGN.md section 12. -->
  <clipPath id="tile"><rect width="16" height="16" rx="3"/></clipPath>
  <g clip-path="url(#tile)">
    <rect width="16" height="16" fill="#fff"/>
    <rect x="0" y="0" width="5" height="7" fill="#C2255C"/>
    <rect x="0" y="8" width="5" height="4" fill="#B01E35"/>
    <rect x="0" y="13" width="5" height="3" fill="#CD4C26"/>
    <rect x="6" y="0" width="4" height="4" fill="#9D6E00"/>
    <rect x="6" y="5" width="4" height="3" fill="#667F19"/>
    <rect x="6" y="9" width="4" height="3" fill="#26828B"/>
    <rect x="6" y="13" width="4" height="3" fill="#6E6A66"/>
    <rect x="11" y="0" width="5" height="5" fill="#1B2A41"/>
    <rect x="11" y="6" width="5" height="6" fill="#4B2E57"/>
    <rect x="11" y="13" width="5" height="3" fill="#986694"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
